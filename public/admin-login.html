<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso administrativo — Pesquisa Senac</title>
  <link rel="stylesheet" href="/css/admin.css">
  <script defer src="/js/admin-login.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="admin-brand" href="/"><span class="brand-mark">S</span><span>Painel da pesquisa</span></a>
    <p class="eyebrow">ÁREA RESTRITA</p>
    <h1>Acesso administrativo</h1>
    <p class="muted">Entre com as credenciais configuradas para consultar as respostas.</p>
    <form id="login-form">
      <label for="username">Usuário</label><input id="username" name="username" required maxlength="100" autocomplete="username">
      <label for="password">Senha</label><input id="password" name="password" type="password" required maxlength="200" autocomplete="current-password">
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button class="button" id="login-button" type="submit">Entrar no painel</button>
    </form>
    <a class="back-link" href="/">← Voltar à pesquisa</a>
  </main>
</body>
</html>
